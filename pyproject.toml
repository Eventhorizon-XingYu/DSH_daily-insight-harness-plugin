[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "daily-insight-plugin"
version = "0.1.0"
description = "Automated daily intelligence articles powered by DeepSeek"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Daily Insight contributors"}]
keywords = ["news", "deepseek", "llm", "automation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
]
dependencies = ["openai>=1.0", "apscheduler>=3.10", "duckduckgo-search>=6.0", "pyyaml>=6.0", "rich>=13.0"]
[project.optional-dependencies]
providers = ["google-search-results>=2.4", "tavily-python>=0.3"]
test = ["pytest>=7", "ruff>=0.5", "build>=1.0"]
[project.scripts]
daily-insight = "daily_insight.main:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
daily_insight = ["prompts/*.md"]
[tool.pytest.ini_options]
pythonpath = ["src"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
ignore = ["DTZ011", "DTZ005", "LOG015", "BLE001"]
